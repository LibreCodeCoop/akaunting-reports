name: Native Akaunting audit integration (synthetic)

on:
  pull_request:
    paths:
      - '.github/workflows/audit-native-integration.yml'
      - 'Support/Audit/**'
      - 'Reports/AuditInconsistencies.php'
      - 'Widgets/AuditInconsistencies.php'
      - 'Console/InstallAudit.php'
      - 'tests/Integration/**'
      - 'module.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: audit-synthetic-only
          MYSQL_DATABASE: audit_synthetic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -paudit-synthetic-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      AUDIT_SYNTHETIC_DATABASE: 'yes'
      AUDIT_FULL_STACK: 'yes'
      AKAUNTING_APP_DIR: /tmp/akaunting
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
          extensions: bcmath,ctype,curl,dom,fileinfo,gd,intl,mbstring,mysqli,pdo_mysql,xml,zip
      - name: Install isolated Akaunting 3.3.0 runtime
        shell: bash
        run: |
          git clone --depth 1 --branch 3.3.0 https://github.com/akaunting/akaunting.git "$AKAUNTING_APP_DIR"
          cd "$AKAUNTING_APP_DIR"
          composer install --prefer-dist --no-progress --no-dev --no-scripts
      - name: Install reviewed module source
        shell: bash
        run: |
          mkdir -p "$AKAUNTING_APP_DIR/modules/AkauntingReports"
          tar --exclude='.git' --exclude='vendor' --exclude='vendor-bin' \
              --exclude='tests' --exclude='.github' \
              -cf - . | tar -xf - -C "$AKAUNTING_APP_DIR/modules/AkauntingReports"
      - name: Compose pending dependent PRs only in disposable homologation
        shell: bash
        run: |
          set -euo pipefail
          # Immutable heads: PR #15 for identity v2 and PR #17 for fiscal/FRA/capital.
          # Never modify the checked-out repository or persist these overlays.
          git fetch --no-tags origin f759d63cb5f6cb46973eda46f01d48d2ad907886
          core="$(git rev-parse FETCH_HEAD)"
          test "$core" = "f759d63cb5f6cb46973eda46f01d48d2ad907886"
          for path in Support/Audit/Occurrence.php Support/Audit/Catalog.php; do
            git show "$core:$path" > "$AKAUNTING_APP_DIR/modules/AkauntingReports/$path"
          done
          git fetch --no-tags origin e27bfa36bd802f434bf2da82677789769138daae
          fiscal="$(git rev-parse FETCH_HEAD)"
          test "$fiscal" = "e27bfa36bd802f434bf2da82677789769138daae"
          for path in \
            Support/Audit/FiscalReceiptRule.php Support/Audit/FiscalReceiptReader.php \
            Support/Audit/FrraIntegrityRule.php Support/Audit/FrraIntegrityReader.php \
            Support/Audit/CapitalIntegrityRule.php Support/Audit/CapitalIntegrityReader.php \
            Support/CapitalSocialReview.php; do
            git show "$fiscal:$path" > "$AKAUNTING_APP_DIR/modules/AkauntingReports/$path"
          done
          echo "Synthetic full-stack audit source assembled from pinned PR heads."
      - name: Initialize throwaway MySQL database
        shell: bash
        run: |
          cd "$AKAUNTING_APP_DIR"
          cp .env.example .env
          sed -i -e 's/^APP_ENV=.*/APP_ENV=local/' \
                 -e 's/^APP_URL=.*/APP_URL=http:\/\/127.0.0.1:18080/' .env
          php artisan key:generate --force
          php artisan install --no-interaction \
              --db-host=127.0.0.1 --db-port=3306 \
              --db-name=audit_synthetic --db-username=root \
              --db-password=audit-synthetic-only --db-prefix= \
              --company-name="Synthetic Company" \
              --company-email=synthetic@example.invalid \
              --admin-email=synthetic-admin@example.invalid \
              --admin-password=audit-synthetic-only \
              --locale=en-GB
      - name: Register audit only in synthetic company
        shell: bash
        run: |
          cd "$AKAUNTING_APP_DIR"
          php artisan akaunting-reports:install-audit --company=1 --dry-run
          php artisan akaunting-reports:install-audit --company=1
      - name: Check native SQL, isolation, ACL and read-only semantics
        shell: bash
        run: |
          set -o pipefail
          php tests/Integration/native_audit_smoke.php 2>&1 | tee /tmp/audit-integration.log
          grep -Fq 'Native Akaunting audit synthetic integration passed:' /tmp/audit-integration.log
      - name: Capture native report and widget previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1500,1100 \
            --screenshot=/tmp/audit-report.png file:///tmp/audit-report-preview.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1050,700 \
            --screenshot=/tmp/audit-widget.png file:///tmp/audit-widget-preview.html
          test -s /tmp/audit-report.png
          test -s /tmp/audit-widget.png
          file /tmp/audit-report.png /tmp/audit-widget.png
      - name: Upload synthetic screenshot evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-synthetic-visual-evidence
          path: |
            /tmp/audit-report.png
            /tmp/audit-widget.png
          if-no-files-found: error
          retention-days: 30
