name: PHP Syntax

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: php-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Composer PHP requirement reader
        run: bash tests/ci/php-version.sh
      - uses: ./.github/actions/setup-project-php
      - name: PHP syntax
        run: composer run-script lint
