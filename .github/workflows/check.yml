name: PHP and business rules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      - name: Business-rule tests
        run: php tests/run.php
      - name: Validate module manifest
        run: php -r '$m=json_decode(file_get_contents("module.json"),true,512,JSON_THROW_ON_ERROR); $required=["Modules\\AkauntingReports\\Reports\\CapitalSocial","Modules\\AkauntingReports\\Reports\\FrraAnnual"]; $actual=$m["reports"]??[]; sort($required); sort($actual); if(($m["alias"]??null)!=="akaunting-reports" || $actual!==$required)exit(1);'
