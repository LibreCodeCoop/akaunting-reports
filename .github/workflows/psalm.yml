name: Psalm Static Analysis

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: psalm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-php
        with:
          extensions: mbstring,dom,xml,xmlwriter,zip
      - name: Install module autoload
        run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
      - name: Install isolated Psalm
        run: composer --working-dir=vendor-bin/psalm install --no-interaction --no-progress --prefer-dist
      - name: Analyze financial rules
        run: composer psalm
