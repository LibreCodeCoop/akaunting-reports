name: PHPUnit

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mbstring,dom,xml,xmlwriter
          coverage: none
      - name: Install module autoload
        run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
      - name: Install isolated PHPUnit
        run: composer --working-dir=vendor-bin/phpunit install --no-interaction --no-progress --prefer-dist
      - name: Test financial business rules
        run: composer test:unit
